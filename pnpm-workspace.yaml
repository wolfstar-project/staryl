overrides:
  ansi-regex: ^6.2.2
  minimist: ^1.2.8
  # @wolfstar/http-framework-i18n@1.2.3 publishes an unresolved
  # "workspace:^" range for this dependency; pin it to a real release.
  "@wolfstar/i18next-backend": ^2.0.8
  # @wolfstar/twitch-helpers@2.0.4 publishes unresolved
  # "workspace:^" ranges for these dependencies; pin them to real releases.
  "@wolfstar/env-utilities": ^2.0.3
  "@wolfstar/safe-fetch": ^1.1.6

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

dedupePeers: true

shellEmulator: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@eslint-community/eslint-plugin-eslint-comments@4.7.2"
  - "@wolfstar/env-utilities@2.0.2"
  - "@wolfstar/http-framework@3.0.0"
  - "@wolfstar/http-framework-i18n@1.2.2"
  - "@wolfstar/http-framework-test-utils@3.0.0"
  - "@wolfstar/logger@2.0.5"
  - "@wolfstar/safe-fetch@1.1.5"
  - "@wolfstar/shared-http-pieces@1.2.6"
  - "@wolfstar/start-banner@2.0.3"
  - "@wolfstar/twitch-helpers@2.0.3"
  - "@wolfstar/i18next-backend@2.0.7"
  - "vitest@4.1.9"

shamefullyHoist: true

hoistPattern:
  - "*prisma*"

ignoreWorkspaceRootCheck: true
