overrides:
  ansi-regex: ^6.4.0
  minimist: ^1.2.8
  "@wolfstar/http-framework": ^6.3.0

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

dedupePeers: true

shellEmulator: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@wolfstar/env-utilities@2.3.1"
  - "@wolfstar/i18next-type-generator@3.1.6"
  - "@wolfstar/start-banner@2.1.3"

minimumReleaseAgeExcludePrune: true

shamefullyHoist: true

hoistPattern:
  - "*prisma*"

ignoreWorkspaceRootCheck: true
