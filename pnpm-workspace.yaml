overrides:
  ansi-regex: ^6.3.0
  minimist: ^1.2.8
  # @wolfstar/http-framework-i18n@1.2.3 publishes an unresolved
  # "workspace:^" range for this dependency; pin it to a real release.
  "@wolfstar/i18next-backend": ^2.0.10
  # @wolfstar/twitch-helpers@2.0.4 publishes unresolved
  # "workspace:^" ranges for these dependencies; pin them to real releases.
  "@wolfstar/env-utilities": ^2.0.5
  "@wolfstar/safe-fetch": ^1.1.8

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

dedupePeers: true

shellEmulator: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@wolfstar/plugin-i18next@2.0.1"
  - "@wolfstar/i18next-type-generator@3.1.0"

shamefullyHoist: true

hoistPattern:
  - "*prisma*"

ignoreWorkspaceRootCheck: true
