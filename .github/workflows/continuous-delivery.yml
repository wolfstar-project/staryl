name: Continuous Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/continuous-delivery.yml"
      - "package.json"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Staryl Latest image to GHCR
    uses: wolfstar-project/.github/.github/workflows/reusable-publish-image.yml@main
