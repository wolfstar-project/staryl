name: tolgee-sync

on:
  workflow_dispatch:
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: tolgee-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync-translations:
    permissions:
      contents: read # checkout repository; the sync branch is pushed with WOLFSTAR_TOKEN
    uses: wolfstar-project/.github/.github/workflows/reusable-tolgee-sync.yml@0a65e26dd292ea41e046e8d75ae681918a0ec046
    with:
      operating-system: ubuntu-26.04-arm
      # root only, no scripts
      install-command:
        pnpm install --frozen-lockfile --filter . --ignore-scripts
      # `tolgee:pull` runs the CLI (config: .tolgeerc.cjs) and then
      # scripts/tolgee-pull-remap.ts, which remaps Tolgee language tags
      # (es, pt, zh-Hans, …) onto the Discord locale directories under src/locales.
      pull-command: pnpm tolgee:pull
      validate-command: pnpm vitest run tests/scripts
      paths: src/locales
    secrets:
      TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
      WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
